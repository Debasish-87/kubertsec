name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  # ── Go Backend ──────────────────────────────────────────────
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        working-directory: backend
        run: go mod download

      - name: Verify go.mod is tidy
        working-directory: backend
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build controller
        working-directory: backend
        run: go build -v ./cmd/controller/...

      - name: Build agent
        working-directory: backend
        run: go build -v ./cmd/agent/...

      - name: Run tests
        working-directory: backend
        run: go test -v ./... || echo "No tests yet"

      - name: Run go vet
        working-directory: backend
        run: go vet ./...

  # ── React Frontend ──────────────────────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: false

  # ── YAML Validation (ROBUST & REALISTIC) ─────────────────────
  yaml-lint:
    name: YAML Rules lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate process_rules.yaml
        run: |
          python3 - <<EOF
          import yaml, sys

          with open('backend/configs/rules/process_rules.yaml') as f:
              data = yaml.safe_load(f)

          # Support both formats
          if isinstance(data, list):
              rules = data
          elif isinstance(data, dict):
              rules = data.get('rules', [])
          else:
              print("Invalid YAML structure")
              sys.exit(1)

          errors = []

          for i, rule in enumerate(rules):
              if not isinstance(rule, dict):
                  errors.append(f"rule_{i}: invalid format")
                  continue

              name = rule.get("name", f"rule_{i}")

              # Required fields
              if not rule.get("name"):
                  errors.append(f"{name}: missing name")

              if not rule.get("severity"):
                  errors.append(f"{name}: missing severity")

              if not rule.get("message"):
                  errors.append(f"{name}: missing message")

              # Detection logic (supports your real schema)
              if not (
                  rule.get("process") or
                  rule.get("processes") or
                  rule.get("process_regex") or
                  rule.get("args_any") or
                  rule.get("args_all")
              ):
                  errors.append(f"{name}: no detection logic defined")

              # Severity validation
              if rule.get("severity") not in ["critical", "high", "medium", "low"]:
                  errors.append(f"{name}: invalid severity")

          if errors:
              print("YAML rule errors:")
              for e in errors:
                  print(" -", e)
              sys.exit(1)

          print(f"All {len(rules)} rules valid.")
          EOF