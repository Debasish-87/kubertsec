---
# ── Agent DaemonSet ───────────────────────────────────────────────────────────
# Runs on EVERY node. Requires privileged + hostPID + hostNetwork.
# The agent attaches eBPF programs to the kernel to monitor syscalls.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubertsec-agent
  namespace: kubertsec
  labels:
    app.kubernetes.io/name:      kubertsec
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      app: kubertsec-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: kubertsec-agent
        app.kubernetes.io/name:      kubertsec
        app.kubernetes.io/component: agent
      annotations:
        prometheus.io/scrape: "false"
    spec:
      serviceAccountName: kubertsec-agent
      # Required for eBPF: host PID namespace + network
      hostPID:     true
      hostNetwork: true
      dnsPolicy:   ClusterFirstWithHostNet
      tolerations:
        # Run on ALL nodes including masters
        - operator: Exists
          effect:   NoSchedule
        - operator: Exists
          effect:   NoExecute
        - operator: Exists
          effect:   PreferNoSchedule
      containers:
        - name: agent
          image: ghcr.io/debasish-87/kubertsec-agent:latest
          imagePullPolicy: Always
          securityContext:
            privileged: true          # Required for eBPF
            runAsUser:   0            # Root required for kernel access
          env:
            - name: RESPONSE_MODE
              valueFrom:
                configMapKeyRef:
                  name: kubertsec-config
                  key:  RESPONSE_MODE
            - name: RULES_PATH
              value: "/configs/rules/process_rules.yaml"
            - name: ALLOWLIST_PATH
              value: "/configs/allowlist.yaml"
            - name: KUBESHIELD_CONTROLLER
              value: "http://kubertsec-controller.kubertsec.svc.cluster.local:8080/event"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KUBECONFIG
              value: ""   # Uses in-cluster service account
          volumeMounts:
            - name: rules
              mountPath: /configs/rules
            - name: allowlist
              mountPath: /configs
            - name: sys
              mountPath: /sys
              readOnly:  true
            - name: proc
              mountPath: /proc
              readOnly:  true
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly:  true
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "500m"
              memory: "256Mi"
      volumes:
        - name: rules
          configMap:
            name: kubertsec-rules
            items:
              - key: process_rules.yaml
                path: process_rules.yaml
        - name: allowlist
          configMap:
            name: kubertsec-rules
            items:
              - key: allowlist.yaml
                path: allowlist.yaml
        - name: sys
          hostPath:
            path: /sys
        - name: proc
          hostPath:
            path: /proc
        - name: btf
          hostPath:
            path: /sys/kernel/btf

---
# ── HorizontalPodAutoscaler — controller ─────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kubertsec-controller
  namespace: kubertsec
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kubertsec-controller
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ── NetworkPolicy ─────────────────────────────────────────────────────────────
# Only allow frontend→controller and agent→controller traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kubertsec-controller
  namespace: kubertsec
spec:
  podSelector:
    matchLabels:
      app: kubertsec-controller
  policyTypes: [Ingress]
  ingress:
    # From frontend (nginx proxy)
    - from:
        - podSelector:
            matchLabels:
              app: kubertsec-frontend
      ports:
        - port: 8080
    # From agent (event ingestion)
    - from:
        - podSelector:
            matchLabels:
              app: kubertsec-agent
      ports:
        - port: 8080
    # From Prometheus scraping
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080

---
# ── PodDisruptionBudget — controller ─────────────────────────────────────────
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubertsec-controller
  namespace: kubertsec
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kubertsec-controller
